# Pipeline Cloud Build — gera 4 imagens em Artifact Registry e faz deploy em Cloud Run.
# Disparado manualmente ou por trigger no push em `main`.
#
# Pré-requisitos:
#   - Artifact Registry repo `aura` em southamerica-east1
#   - Service accounts: aura-api-sa, aura-web-sa, aura-learn-sa, aura-admin-sa
#   - Cloud SQL instance + secret `aura-database-url` no Secret Manager
#   - Secrets do Stripe, Mux, Resend no Secret Manager

substitutions:
  _REGION: southamerica-east1
  _AR_REPO: aura
  _PROJECT: auraeducacional

steps:
  # ----------------------------- API -----------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/api:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/api:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/api]

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aura-api
      - --image=$_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/api:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=aura-api-sa@$_PROJECT.iam.gserviceaccount.com
      - --set-secrets=DATABASE_URL=aura-database-url:latest,STRIPE_SECRET_KEY=stripe-secret:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,MUX_TOKEN_SECRET=mux-token-secret:latest,RESEND_API_KEY=resend-api-key:latest
      - --set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=$_PROJECT
      - --add-cloudsql-instances=$_PROJECT:$_REGION:aura-postgres
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=10
      - --concurrency=80
      - --timeout=300

  # ----------------------------- WEB -----------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://api.auraeducacional.com.br
      - -t
      - $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/web:$SHORT_SHA
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/web]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aura-web
      - --image=$_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/web:$SHORT_SHA
      - --region=$_REGION
      - --allow-unauthenticated
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=20

  # ----------------------------- LEARN ---------------------------
  - id: build-learn
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/learn/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/learn:$SHORT_SHA
      - .
  - id: push-learn
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/learn]
  - id: deploy-learn
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aura-learn
      - --image=$_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/learn:$SHORT_SHA
      - --region=$_REGION
      - --allow-unauthenticated
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10

  # ----------------------------- ADMIN ---------------------------
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/admin/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/admin:$SHORT_SHA
      - .
  - id: push-admin
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/admin]
  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aura-admin
      - --image=$_REGION-docker.pkg.dev/$_PROJECT/$_AR_REPO/admin:$SHORT_SHA
      - --region=$_REGION
      - --allow-unauthenticated
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=5

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
