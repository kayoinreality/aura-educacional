# Postgres local para desenvolvimento.
# Espelha o que rodará no Cloud SQL em produção.

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aura
    ports:
      - '5432:5432'
    volumes:
      - aura_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aura']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aura_pg_data:
