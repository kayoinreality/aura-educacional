{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="stats-grid">
  <div class="stat-card">
    <p class="stat-card__label">Usuários</p>
    <p class="stat-card__value">{{ stats.users }}</p>
  </div>
  <div class="stat-card">
    <p class="stat-card__label">Cursos</p>
    <p class="stat-card__value">{{ stats.courses }}</p>
  </div>
  <div class="stat-card">
    <p class="stat-card__label">Matrículas</p>
    <p class="stat-card__value">{{ stats.enrollments }}</p>
  </div>
  <div class="stat-card">
    <p class="stat-card__label">Receita total</p>
    <p class="stat-card__value">{{ stats.revenue | currency }}</p>
  </div>
</div>
{% endblock %}
