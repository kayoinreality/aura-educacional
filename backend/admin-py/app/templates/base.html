<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Backoffice{% endblock %} — Aura Educacional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar__brand"><span>Aura</span> Backoffice</div>
    <nav class="sidebar__nav">
      <a href="/dashboard" class="sidebar__link {% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/users" class="sidebar__link {% if '/users' in request.url.path %}active{% endif %}">Usuários</a>
      <a href="/courses" class="sidebar__link {% if '/courses' in request.url.path %}active{% endif %}">Cursos</a>
      <a href="/enrollments" class="sidebar__link {% if '/enrollments' in request.url.path %}active{% endif %}">Matrículas</a>
      <a href="/payments" class="sidebar__link {% if '/payments' in request.url.path %}active{% endif %}">Pagamentos</a>
    </nav>
    <div class="sidebar__footer">
      <a href="/auth/logout">Sair</a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <span class="topbar__title">{% block page_title %}{% endblock %}</span>
      {% if user is defined %}
      <span class="topbar__user">{{ user.firstName }} {{ user.lastName }}</span>
      {% endif %}
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
